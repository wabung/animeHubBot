services:
  db:
    image: postgres:16-alpine
    container_name: animehub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: animehub
    ports:
      - "5432:5432"
    volumes:
      - animehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animehub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  animehub_pgdata:
